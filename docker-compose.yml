services:
  livefire:
    build: .
    ports:
      - "8000:8000"
    environment:
      # pass your OpenRouter key at runtime: LLM_API_KEY=sk-or-... docker compose up
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL_STRATEGY=${LLM_MODEL_STRATEGY:-}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-max}
      # ledger lives on the mounted volume (audit 11/K4: mount /app/data/ledger so data/splits in image remain accessible)
      - LIVEFIRE_DB=/app/data/ledger/arena_ledger.db
    volumes:
      - ledger-data:/app/data/ledger
volumes:
  ledger-data:
